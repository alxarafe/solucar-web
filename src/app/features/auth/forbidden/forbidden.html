<main class="forbidden">
  <section class="forbidden__panel">
    <h1 class="forbidden__title" i18n="@@auth.forbidden.title">Access denied</h1>
    <p class="forbidden__message" i18n="@@auth.forbidden.message">
      Your account does not have permission to access this page.
    </p>
    <a class="forbidden__link" [routerLink]="contactsPath" i18n="@@auth.forbidden.backToContacts">
      Back to contacts
    </a>
  </section>
</main>
